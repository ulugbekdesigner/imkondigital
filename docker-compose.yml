name: imkondigital

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imkon
      POSTGRES_PASSWORD: imkon
      POSTGRES_DB: imkon
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imkon -d imkon']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment: &api-env
      ENVIRONMENT: development
      DEBUG: 'true'
      DATABASE_URL: postgresql+asyncpg://imkon:imkon@postgres:5432/imkon
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      SITE_URL: http://localhost:${WEB_PORT:-3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dev-gemini-api-key}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ['celery', '-A', 'app.worker.celery_app', 'worker', '--loglevel=info', '--concurrency=2']
    environment: *api-env
    volumes:
      # faster-whisper (AI subtitr) modelini qayta-qayta yuklab olmaslik uchun
      - whisper-cache:/home/imkon/.cache
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      # Server tomonidan (route handler / middleware) konteyner ichidan API'ga
      API_INTERNAL_URL: http://api:8000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 15

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-dev-telegram-bot-token}
      TELEGRAM_INTERNAL_SECRET: ${TELEGRAM_INTERNAL_SECRET:-dev-telegram-internal-secret}
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  whisper-cache:

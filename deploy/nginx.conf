# IMKON Digital — production reverse proxy (Nginx + Certbot/Let's Encrypt).
#
# Domenni almashtiring: barcha "imkondigital.uz" o'rniga haqiqiy domeningizni
# qo'ying (docs/deploy.md'da `sed` buyrug'i bilan avtomatlashtirilgan).
# Ishga tushirishdan oldin sertifikat http-01 (webroot) usulida olinishi kerak
# — tafsilot docs/deploy.md'da.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml
    application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # --- ACME challenge (certbot) + HTTP -> HTTPS redirect, barcha subdomenlar ---
  # media.imkondigital.uz BU YERDA YO'Q — R2 custom domain sifatida
  # to'g'ridan-to'g'ri Cloudflare orqali ishlaydi, VPS'ga umuman tegmaydi.
  server {
    listen 80;
    server_name imkondigital.uz www.imkondigital.uz api.imkondigital.uz;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- Asosiy sayt (Next.js) ---
  server {
    listen 443 ssl;
    http2 on;
    server_name imkondigital.uz www.imkondigital.uz;

    ssl_certificate     /etc/letsencrypt/live/imkondigital.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imkondigital.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # --- API (FastAPI) ---
  server {
    listen 443 ssl;
    http2 on;
    server_name api.imkondigital.uz;

    ssl_certificate     /etc/letsencrypt/live/imkondigital.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imkondigital.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Video dars yuklash (lesson upload) — katta fayllarga joy
    client_max_body_size 500m;
    proxy_read_timeout 300s;

    location / {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # media.imkondigital.uz UCHUN BLOK YO'Q — R2 bucket'ning custom domeni
  # sifatida Cloudflare panelida sozlanadi, video/fayl trafigi bu VPS'ga
  # umuman kelmaydi (docs/deploy.md, "Media domeni (R2)" bo'limi).
}

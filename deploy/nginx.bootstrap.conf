# Bitta martalik boshlang'ich konfiguratsiya — birinchi TLS sertifikat
# olinmaguncha ishlatiladi (docs/deploy.md, 4-qadam). SSL sertifikat hali
# yo'q bo'lgani uchun asosiy nginx.conf'dagi 443-bloklar bu yerda YO'Q —
# aks holda nginx sertifikat topa olmay ishga tushmaydi.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name imkondigital.uz www.imkondigital.uz api.imkondigital.uz;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 200 "IMKON Digital — TLS sertifikat sozlanmoqda.\n";
      add_header Content-Type text/plain;
    }
  }
}
